<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar</title>
<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg,#d777ef,#ee7cfa);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }

  .calendar-container {
    width: 100%;
    max-width: 600px;
    background: #8e4bad;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    padding: 20px;
  }

  .calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
  }

  .calendar-header button {
    padding: 5px 12px;
    border:none;
    border-radius:8px;
    background: linear-gradient(45deg,#f88488,#fad0c4);
    cursor:pointer;
    font-size: 18px;
  }

  #monthYear {
    font-size: 1.5em;
    font-weight: bold;
  }

  .weekdays, .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7,1fr);
    text-align: center;
  }

  .weekdays div {
    font-weight: bold;
    padding: 8px 0;
    color: #555;
  }

  .calendar-cell {
    height: 50px;
    margin: 3px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    background: #c56dd4;
  }

  .calendar-cell:hover {
    background: #326a9b;
  }

  .current-day {
    border: 2px solid #7c9fc4;
    font-weight: bold;
  }

  .event-day {
    background: #ffe066;
  }

  .completed-task {
    background: #4caf50;
    color: #fff;
  }

  .sunday-cell {
    border: 2px dashed #ff6b81;
  }

  .saturday-cell {
    border: 2px dashed #6b9cff;
  }

  .tasks-section {
    margin-top: 20px;
    background: #f7f7f7;
    padding: 10px;
    border-radius: 12px;
  }

  .tasks-section ul {
    list-style: none;
    padding: 0;
    margin: 5px 0 0 0;
  }

  .tasks-section li {
    padding: 6px 10px;
    border-bottom: 1px solid #ddd;
  }

  #backBtn {
    margin-top: 15px;
    padding: 6px 15px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(45deg,#fbc2eb,#a6c1ee);
    cursor: pointer;
    font-size: 16px;
  }
</style>
</head>
<body>

<div class="calendar-container">
  <div class="calendar-header">
    <button id="prevMonth">&lt;</button>
    <div id="monthYear"></div>
    <button id="nextMonth">&gt;</button>
  </div>

  <div class="weekdays" id="weekdays"></div>
  <div class="calendar-grid" id="calendar"></div>

  <div class="tasks-section">
    <h3 id="tasksDateTitle">Select a date to see tasks</h3>
    <ul id="tasksListByDate"></ul>
  </div>

  <button id="backBtn">⬅ Back to Dashboard</button>
</div>

<script>
  const weekdaysEl = document.getElementById("weekdays");
  const calendarEl = document.getElementById("calendar");
  const monthYearEl = document.getElementById("monthYear");
  const prevBtn = document.getElementById("prevMonth");
  const nextBtn = document.getElementById("nextMonth");
  const tasksDateTitle = document.getElementById("tasksDateTitle");
  const tasksListByDate = document.getElementById("tasksListByDate");
  const backBtn = document.getElementById("backBtn");

  const weekdays = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  weekdays.forEach(day=>{
    const el = document.createElement("div");
    el.textContent = day;
    weekdaysEl.appendChild(el);
  });

  let today = new Date();
  let currentMonth = today.getMonth();
  let currentYear = today.getFullYear();

  function showTasksForDate(dateStr){
    const tasks = JSON.parse(localStorage.getItem("tasks")||"[]")
      .filter(t=>t.user===localStorage.getItem("currentUser") && t.date===dateStr);
    tasksDateTitle.textContent = "Tasks for " + dateStr;
    tasksListByDate.innerHTML="";
    if(tasks.length===0){
      tasksListByDate.innerHTML="<li>No tasks</li>";
    } else {
      tasks.forEach(t=>{
        const li = document.createElement("li");
        li.textContent = `${t.name} ⏰ ${t.time} ${t.done?"✅":"⬜"}`;
        tasksListByDate.appendChild(li);
      });
    }
  }

  function renderCalendar(){
    calendarEl.innerHTML="";
    const firstDay = new Date(currentYear,currentMonth,1).getDay();
    const lastDate = new Date(currentYear,currentMonth+1,0).getDate();

    monthYearEl.textContent = new Date(currentYear,currentMonth).toLocaleString('default',{month:'long',year:'numeric'});

    for(let i=0;i<firstDay;i++){
      const blank = document.createElement("div");
      calendarEl.appendChild(blank);
    }

    for(let d=1;d<=lastDate;d++){
      const dayEl = document.createElement("div");
      dayEl.className="calendar-cell";
      dayEl.textContent=d;

      const dayOfWeek = new Date(currentYear,currentMonth,d).getDay();
      if(dayOfWeek===0) dayEl.classList.add("sunday-cell");
      if(dayOfWeek===6) dayEl.classList.add("saturday-cell");

      if(d===today.getDate() && currentMonth===today.getMonth() && currentYear===today.getFullYear()){
        dayEl.classList.add("current-day");
      }

      const tasks = JSON.parse(localStorage.getItem("tasks")||"[]")
        .filter(t=>t.user===localStorage.getItem("currentUser"));
      const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dayTasks = tasks.filter(t=>t.date===dateStr);

      if(dayTasks.length){
        if(dayTasks.every(t=>t.done)) dayEl.classList.add("completed-task");
        else dayEl.classList.add("event-day");
      }

      dayEl.onclick = ()=> showTasksForDate(dateStr);
      calendarEl.appendChild(dayEl);
    }
  }

  prevBtn.onclick = ()=>{
    currentMonth--;
    if(currentMonth<0){currentMonth=11; currentYear--;}
    renderCalendar();
  }

  nextBtn.onclick = ()=>{
    currentMonth++;
    if(currentMonth>11){currentMonth=0; currentYear++;}
    renderCalendar();
  }

  backBtn.onclick = ()=>{
    window.location.href = "dashboard.html";
  }

  renderCalendar();
</script>
</body>
</html>
